[package]
name = "mna-core"
version = "0.1.0"
description = "Platform-neutral building blocks of Meeting Notes AI: Ollama Cloud helpers, transcript cleanup, word diff and audio file decoding"
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
name = "mna_core"
path = "src/lib.rs"

# Deliberately free of macOS-only dependencies so this crate builds and is
# tested on Linux CI (see .github/workflows/contracts.yml, quick job).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "isomp4", "mp3", "wav", "pcm", "flac", "vorbis", "ogg"] }

[lints]
workspace = true
